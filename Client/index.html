<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Primary SEO Meta Tags -->
    <meta
      name="description"
      content="Join Elshaddai Apostolic Mission for spiritual worship, Bible teachings, and Christian fellowship. Serving Ethiopian and Eritrean communities in Amharic, Tigrigna, and English."
    />
    <meta name="author" content="Elshaddai Apostolic Mission" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Geographical Targeting -->
    <meta name="geo.region" content="ET" />
    <meta name="geo.placename" content="UK" />

    <!-- Social Media Meta Tags -->
    <meta property="og:site_name" content="Elshaddai Apostolic Mission" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://www.elshaddaiapostolicmission.com/"
    />
    <meta
      property="og:title"
      content="Elshaddai Apostolic Mission | Ethiopian & Eritrean Apostolic Church"
    />
    <meta
      property="og:description"
      content="Experience authentic Apostolic worship and Bible teaching with our Ethiopian and Eritrean Christian community."
    />
    <meta
      property="og:image"
      content="https://www.elshaddaiapostolicmission.com/assets/images/social/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ElshaddaiMission" />
    <meta name="twitter:creator" content="@ElshaddaiMission" />
    <meta name="twitter:title" content="Elshaddai Apostolic Mission" />
    <meta
      name="twitter:description"
      content="Join our growing Apostolic community for spiritual growth and fellowship."
    />
    <meta
      name="twitter:image"
      content="https://www.elshaddaiapostolicmission.com/assets/images/social/twitter-card.jpg"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "PlaceOfWorship",
        "name": "Elshaddai Apostolic Mission",
        "image": [
          "https://www.elshaddaiapostolicmission.com/assets/images/logo/logo-400x400.webp",
          "https://www.elshaddaiapostolicmission.com/assets/images/logo/logo-1200x630.webp"
        ],
        "description": "Apostolic Christian church serving Ethiopian and Eritrean communities worldwide",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Church Street",
          "addressLocality": "Addis Ababa",
          "addressRegion": "AA",
          "postalCode": "1000",
          "addressCountry": "ET"
        },
        "telephone": "+251-911-234567",
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Friday", "Saturday", "Sunday"],
          "opens": "18:00",
          "closes": "20:00"
        },
        "sameAs": [
          "https://www.facebook.com/ElshaddaiApostolic",
          "https://twitter.com/ElshaddaiMission",
          "https://www.youtube.com/@ElshaddaiApostolic"
        ]
      }
    </script>
    <meta name="twitter:image" content="./src/assets/images/logo/Fab.png" />
    <title>Elshaddai Apostolic Mission |</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./src/assets/images/logo/Fab.png" />

    <!-- Preload Key Assets for Performance -->
    <link rel="preload" as="image" href="./src/assets/images/logo/Fab.png" />

    <!-- CSS & JS Libraries -->
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- JavaScript Files -->
    <script type="module" src="/src/main.jsx"></script>
    <script defer src="./src/assets/js/swiper-bundle.min.js"></script>
    <script defer src="./src/assets/js/isotope.pkgd.min.js"></script>
    <script defer src="./src/assets/js/accordion.js"></script>
    <script defer src="./src/assets/js/chart.js"></script>
    <script defer src="./src/assets/js/count.js"></script>
    <script defer src="./src/assets/js/countdown.js"></script>
    <script defer src="./src/assets/js/counterup.js"></script>
    <script defer src="./src/assets/js/dropdown.js"></script>
    <script defer src="./src/assets/js/filter.js"></script>
    <script defer src="./src/assets/js/mobileMenu.js"></script>
    <script defer src="./src/assets/js/modal.js"></script>
    <script defer src="./src/assets/js/popup.js"></script>
    <script defer src="./src/assets/js/preloader.js"></script>
    <script defer src="./src/assets/js/scrollUp.js"></script>
    <script defer src="./src/assets/js/slider.js"></script>
    <script defer src="./src/assets/js/smoothScroll.js"></script>
    <script defer src="./src/assets/js/stickyHeader.js"></script>
    <script defer src="./src/assets/js/tabs.js"></script>
    <script defer src="./src/assets/js/theme.js"></script>
    <script defer src="./src/assets/js/videoModal.js"></script>
    <script defer src="./src/assets/js/vanilla-tilt.js"></script>
    <script defer src="./src/assets/js/aos.js"></script>
    <script defer src="./src/assets/js/main.js"></script>
  </body>
</html>
